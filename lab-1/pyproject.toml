[project]
name = "lab-1"
version = "0.1.0"
description = "Deep Learning, лабораторная N"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "numpy",
    "pandas",
    "scikit-learn",
    "plotly",
    "kaleido",  # PNG-фолбэк для графиков (использует установленный Chrome)
    "tqdm",
    "mlflow",
    "catboost>=1.2.10",
    "kagglehub>=1.0.3",
    "pytorch-tabular>=1.2.0",
    "optuna>=5.0.0",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.615.71 ; sys_platform == 'linux'",
    "xiaomi-tabldm",
    "tabm>=0.0.3",
    "rtdl-num-embeddings>=0.0.12",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter",
    "nbformat",
    "ruff",
    "ty",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# macOS: torch с PyPI (MPS включён). Linux (RTX 4090): CUDA 13.2.
[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]
xiaomi-tabldm = { git = "https://github.com/xiaomi-research/xiaomi-tabldm", rev = "03cfbb9e7069b821dcef32676dc19b40d294e348" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["submission"]  # склейка /pack-submission: повторные импорты модулей
force-exclude = true  # исключение действует и на файлы от pre-commit

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F401", "B018"]  # импорты по ячейкам, последнее выражение — вывод ячейки

[tool.ty.analysis]
# lightning ставится через uv add, только если лаба на Lightning
allowed-unresolved-imports = ["lightning", "lightning.**"]

[tool.ty.rules]
invalid-mutable-override = "ignore"  # ложное срабатывание на nn.Module.forward
